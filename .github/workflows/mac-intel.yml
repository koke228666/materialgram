name: macOS Intel (x86_64)

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  macos-intel:
    name: macOS Intel
    runs-on: macos-14
    env:
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          softwareupdate --install-rosetta --agree-to-license || true

      - name: Libs cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-intel-libs-${{ hashFiles('Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            macos-intel-libs-

      - name: Libraries
        run: |
          ./Telegram/build/prepare/mac.sh silent

      - name: Free disk space
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Configure and build (Intel)
        run: |
          cd Telegram
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_OSX_ARCHITECTURES=x86_64 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID=${{ secrets.API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.API_HASH }} \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D CMAKE_EXE_LINKER_FLAGS="-Wl,-x"
          cmake --build ../out --config Release --parallel

      - name: Pack artifact
        run: |
          cd out/Release
          mkdir -p artifact
          mv materialgram.app artifact/ || mv Telegram.app artifact/materialgram.app
          mv Updater artifact/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: materialgram-intel-x86_64
          path: out/Release/artifact/
